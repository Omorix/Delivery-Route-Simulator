<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery Route Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#101418;--paper:#fff;--grey:#6a727a;--rule:#101418;--blue:#0019a8;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 "Archivo",system-ui,sans-serif;color:var(--ink);background:var(--paper);font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:352px 1fr;height:100%}
aside{background:var(--paper);border-right:3px solid var(--rule);overflow-y:auto;padding:0 0 28px}
header{background:var(--ink);color:#fff;padding:16px 20px 14px}
h1{font-size:26px;font-weight:800;line-height:1;margin:0;letter-spacing:-.02em}
header p{margin:6px 0 0;font-size:13px;color:#c9ced3}
.stripe{display:flex;height:8px}.stripe i{flex:1}
section{padding:14px 20px 0}
h2{font-size:15px;font-weight:800;margin:0 0 8px}
.tabs{display:flex;border-bottom:3px solid var(--rule);padding:0 20px;margin-top:0}
.tabs button{flex:1;border:0;background:none;padding:12px 4px 9px;font-weight:600;color:var(--grey);border-bottom:6px solid transparent;margin-bottom:-3px;border-radius:0}
.tabs button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--blue)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:2px solid var(--ink);background:var(--paper);padding:8px 14px;font-weight:600;border-radius:2px}
.btn:hover{background:var(--ink);color:#fff}
.btn.go{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:800}
.btn.go:hover{background:var(--ink);border-color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
select,input{border:2px solid var(--ink);background:var(--paper);border-radius:2px;padding:7px 8px;width:100%}
label{display:block;font-weight:600;margin-top:10px}
label>*:last-child{margin-top:4px;font-weight:400}
.totals{display:grid;grid-template-columns:1fr 1fr;border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);margin:16px 20px 0;padding:0}
.totals div{padding:8px 0;border-bottom:1px solid #d9dcdf}
.totals div:nth-last-child(-n+2){border-bottom:0}
.totals dt{color:var(--grey);font-size:12.5px}
.totals dd{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em}
.totals dl{display:contents}
#board{list-style:none;margin:0;padding:0;background:var(--ink);color:#fff;max-height:260px;overflow-y:auto}
#board:empty::after{content:"No vans yet. Add some orders.";display:block;padding:14px;color:#9aa3ab}
#board li{position:relative;display:grid;grid-template-columns:14px 1fr auto 76px;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid #2a3138}
#board i{width:14px;height:14px;border-radius:50%}
#board em{font-style:normal;text-align:right;color:#c9ced3}
#board u{position:absolute;left:0;bottom:0;height:3px}
#cmpStats{margin-top:10px}
#cmpStats strong{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
#msg{min-height:1.4em;color:#b00020;font-weight:600;margin:12px 20px 0}
#maps{display:grid;grid-template-columns:1fr;min-width:0}
#maps.split{grid-template-columns:1fr 1fr;gap:3px;background:var(--ink)}
.pane{position:relative;min-width:0;min-height:0}
.pane>div:last-child{position:absolute;inset:0}
.tag{position:absolute;z-index:500;left:54px;top:10px;background:var(--ink);color:#fff;padding:6px 10px;font-weight:600;font-size:13px;display:none}
.split .tag{display:block}
.depot span{display:block;width:20px;height:20px;background:var(--ink);border:3px solid #fff;box-shadow:0 0 0 2px var(--ink)}
.leaflet-container{font-family:inherit;background:#e8eaec}
[hidden]{display:none!important}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:auto 62vh;height:auto}aside{border-right:0;border-bottom:3px solid var(--rule)}#maps.split{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
</style>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <h1>Dispatch</h1>
      <p>Click the map to send a new order to the nearest van that can take it.</p>
    </header>
    <div class="stripe" aria-hidden="true"><i style="background:#e4572e"></i><i style="background:#17a398"></i><i style="background:#7b5ea7"></i><i style="background:#f3a712"></i><i style="background:#2e86ab"></i><i style="background:#c2185b"></i></div>

    <div class="tabs" id="algos" role="group" aria-label="Algorithm">
      <button data-algo="greedy" aria-pressed="false">Greedy</button>
      <button data-algo="savings" aria-pressed="false">Savings</button>
      <button data-algo="savings+ls" aria-pressed="true">Savings + search</button>
    </div>

    <section>
      <div class="row">
        <button id="go" class="btn go">Start</button>
        <button id="reset" class="btn">Reset</button>
      </div>
      <label>Clock speed
        <select id="speed">
          <option value="1">Real time</option>
          <option value="60" selected>1 minute per second</option>
          <option value="300">5 minutes per second</option>
          <option value="1200">20 minutes per second</option>
        </select>
      </label>
    </section>

    <dl class="totals">
      <div><dt>Time on the road</dt><dd id="s-clock">0:00:00</dd></div>
      <div><dt>Delivered</dt><dd id="s-del">0 of 0</dd></div>
      <div><dt>Planned</dt><dd id="s-plan">0 km</dd></div>
      <div><dt>Driven</dt><dd id="s-trav">0 km</dd></div>
      <div><dt>Van fill</dt><dd id="s-util">0%</dd></div>
      <div><dt>Vans out</dt><dd id="s-vans">0</dd></div>
    </dl>
    <section style="padding-top:8px"><span style="font-size:12.5px;color:#6a727a">Last plan took </span><b id="s-solve">0 ms</b></section>

    <section><h2>Vans</h2></section>
    <ol id="board" aria-label="Van progress"></ol>

    <section>
      <h2>Scenario</h2>
      <label style="margin-top:0">A click on the map will
        <select id="mode"><option value="order">add an order</option><option value="depot">move the depot</option></select>
      </label>
      <label>Parcel size (a van holds 100)
        <input id="size" type="number" min="1" max="100" value="5">
      </label>
      <div class="row" style="margin-top:10px">
        <button id="rand" class="btn">New random day</button>
        <button id="clear" class="btn">Clear</button>
      </div>
    </section>

    <section>
      <h2>Greedy against optimised</h2>
      <button id="cmp" class="btn" style="width:100%">Compare on this scenario</button>
      <div id="cmpStats" aria-live="polite"></div>
    </section>
    <p id="msg" role="status"></p>
  </aside>

  <main id="maps">
    <div class="pane"><div class="tag" id="tagA"></div><div id="mapA"></div></div>
    <div class="pane" id="paneB" hidden><div class="tag" id="tagB"></div><div id="mapB"></div></div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORS = ['#e4572e','#17a398','#7b5ea7','#f3a712','#2e86ab','#c2185b','#5c8001','#8d5b3a','#0b6e4f','#d1495b'];
const color = id => COLORS[(id - 1) % COLORS.length];
const $ = id => document.getElementById(id);
const fmt = (x, d = 1) => Number(x).toFixed(d);
const clock = s => { s = Math.floor(s); return `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
const KMH = 40; // keep in step with Simulation.DEFAULT_SPEED_KMH

async function api(path, method = 'GET', body) {
  const r = await fetch('/api' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const say = m => { $('msg').textContent = m || ''; };

function makeView(el) {
  const map = L.map(el).setView([51.5074, -0.1278], 11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
  return { map, layer: L.layerGroup().addTo(map), vans: L.layerGroup().addTo(map), orders: {}, vanMarkers: {} };
}
const A = makeView('mapA');
let B = null;

function draw(view, depot, orders, routes) {
  view.layer.clearLayers();
  view.vans.clearLayers();
  view.vanMarkers = {};
  view.orders = {};
  const owner = {};
  routes.forEach(r => r.orderIds.forEach(id => owner[id] = r.vanId));
  routes.forEach(r => L.polyline(r.path.map(p => [p.lat, p.lng]), { color: color(r.vanId), weight: 3, opacity: .85 }).addTo(view.layer));
  orders.forEach(o => {
    view.orders[o.id] = L.circleMarker([o.location.lat, o.location.lng], {
      radius: 4 + o.size * 0.5, color: '#fff', weight: 1.5, fillColor: owner[o.id] ? color(owner[o.id]) : '#888', fillOpacity: .95
    }).bindTooltip(`Order ${o.id}, parcel size ${o.size}`).addTo(view.layer);
  });
  L.marker([depot.lat, depot.lng], { icon: L.divIcon({ className: 'depot', html: '<span></span>', iconSize: [18, 18] }) })
    .bindTooltip('Depot').addTo(view.layer);
}

function fitTo(view, depot, orders) {
  const pts = [[depot.lat, depot.lng], ...orders.map(o => [o.location.lat, o.location.lng])];
  view.map.fitBounds(pts, { padding: [40, 40] });
}

// ---------- live simulation ----------
let planVersion = -1, routeOrders = {}, running = false, comparing = false, refreshing = false;

function applyState(st, fit) {
  planVersion = st.plan.planVersion;
  routeOrders = {};
  st.plan.routes.forEach(r => routeOrders[r.vanId] = r.orderIds);
  draw(A, st.plan.depot, st.plan.orders, st.plan.routes);
  if (fit) fitTo(A, st.plan.depot, st.plan.orders);
  applyTick(st);
  document.querySelectorAll('#algos button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.algo === st.snapshot.stats.algorithm)));
  const speeds = [...$('speed').options].map(o => +o.value);
  $('speed').value = String(speeds.reduce((a, b) => Math.abs(b - st.speed) < Math.abs(a - st.speed) ? b : a));
}

function applyTick(t) {
  const s = t.snapshot.stats;
  running = t.running;
  $('go').textContent = running ? 'Pause' : (s.finished ? 'Done' : 'Start');
  $('s-clock').textContent = clock(s.simTimeSeconds);
  $('s-del').textContent = `${s.deliveredOrders} of ${s.totalOrders}`;
  $('s-plan').textContent = `${fmt(s.plannedDistanceKm)} km`;
  $('s-trav').textContent = `${fmt(s.travelledKm)} km`;
  $('s-util').textContent = `${fmt(s.utilisation * 100, 0)}%`;
  $('s-vans').textContent = s.vans;
  $('s-solve').textContent = `${fmt(s.lastSolveMillis, s.lastSolveMillis < 10 ? 2 : 0)} ms`;
  $('board').innerHTML = t.snapshot.vans.map(v => {
    const tot = v.delivered + v.remainingStops, pct = tot ? 100 * v.delivered / tot : 0;
    return `<li><i style="background:${color(v.id)}"></i><b>Van ${v.id}</b><span>${v.delivered} of ${tot}</span><em>${fmt(v.distanceKm)} km</em><u style="width:${pct}%;background:${color(v.id)}"></u></li>`;
  }).join('');
  const live = new Set();
  t.snapshot.vans.forEach(v => {
    live.add(v.id);
    let m = A.vanMarkers[v.id];
    if (!m) m = A.vanMarkers[v.id] = L.circleMarker([v.lat, v.lng], { radius: 8, color: '#14202b', weight: 2, fillColor: color(v.id), fillOpacity: 1 }).addTo(A.vans);
    m.setLatLng([v.lat, v.lng]);
    (routeOrders[v.id] || []).forEach((id, i) => A.orders[id] && A.orders[id].setStyle({ fillOpacity: i < v.delivered ? .2 : .95 }));
  });
  Object.keys(A.vanMarkers).forEach(id => { if (!live.has(+id)) { A.vans.removeLayer(A.vanMarkers[id]); delete A.vanMarkers[id]; } });
}

async function refresh(fit) { if (refreshing) return; refreshing = true; try { applyState(await api('/state'), fit); } finally { refreshing = false; } }
async function act(fn, fit) { try { say(''); applyState(await fn(), fit); } catch (e) { say(e.message); } }

function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onmessage = e => {
    if (comparing) return;
    const t = JSON.parse(e.data);
    if (t.snapshot.planVersion !== planVersion) refresh(false); else applyTick(t);
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

// ---------- controls ----------
$('go').onclick = () => act(() => api(running ? '/sim/pause' : '/sim/start', 'POST'));
$('reset').onclick = () => act(() => api('/sim/reset', 'POST'));
$('speed').onchange = e => act(() => api('/sim/speed', 'POST', { multiplier: +e.target.value }));
document.querySelectorAll('#algos button').forEach(b => b.onclick = () => { exitCompare(); act(() => api('/algorithm', 'POST', { name: b.dataset.algo })); });
$('rand').onclick = () => { exitCompare(); act(() => api('/scenario/random', 'POST', { orders: 40, seed: Math.floor(Math.random() * 1e6) }), true); };
$('clear').onclick = () => { exitCompare(); act(() => api('/scenario/clear', 'POST')); };
A.map.on('click', e => {
  if (comparing) return;
  const { lat, lng } = e.latlng;
  if ($('mode').value === 'depot') act(() => api('/scenario/depot', 'POST', { lat, lng }));
  else act(() => api('/orders', 'POST', { lat, lng, size: Math.max(1, +$('size').value || 5) }));
});

// ---------- greedy vs optimised, side by side ----------
let anim = null;
function pathMetres(path) {
  const cum = [0];
  for (let i = 1; i < path.length; i++) cum.push(cum[i - 1] + L.latLng(path[i - 1].lat, path[i - 1].lng).distanceTo(L.latLng(path[i].lat, path[i].lng)));
  return cum;
}
function along(path, cum, d) {
  d = Math.min(d, cum[cum.length - 1]);
  let i = 1; while (i < cum.length - 1 && cum[i] < d) i++;
  const f = cum[i] === cum[i - 1] ? 1 : (d - cum[i - 1]) / (cum[i] - cum[i - 1]);
  return [path[i - 1].lat + (path[i].lat - path[i - 1].lat) * f, path[i - 1].lng + (path[i].lng - path[i - 1].lng) * f];
}
function startAnim(sides) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const items = sides.map(({ view, routes }) => ({ view, routes: routes.map(r => ({ r, path: r.path, cum: pathMetres(r.path) })) }));
  items.forEach(it => it.routes.forEach(x => x.marker = L.circleMarker([x.path[0].lat, x.path[0].lng], { radius: 7, color: '#14202b', weight: 2, fillColor: color(x.r.vanId), fillOpacity: 1 }).addTo(it.view.vans)));
  const longest = Math.max(...items.flatMap(it => it.routes.map(x => x.cum[x.cum.length - 1])));
  const SIM_SECONDS_PER_SECOND = 600, MS = KMH * 1000 / 3600;
  let t0 = performance.now(), id;
  const frame = now => {
    const simT = (now - t0) / 1000 * SIM_SECONDS_PER_SECOND;
    items.forEach(it => it.routes.forEach(x => x.marker.setLatLng(along(x.path, x.cum, simT * MS))));
    if (simT * MS > longest + 1500) t0 = now; // everyone home: loop
    id = requestAnimationFrame(frame);
  };
  id = requestAnimationFrame(frame);
  anim = () => cancelAnimationFrame(id);
}
function stopAnim() { if (anim) anim(); anim = null; [A, B].forEach(v => v && v.vans.clearLayers()); }

async function enterCompare() {
  try {
    say('');
    const c = await api('/compare');
    comparing = true;
    $('maps').classList.add('split');
    $('paneB').hidden = false;
    if (!B) B = makeView('mapB');
    A.map.invalidateSize(); B.map.invalidateSize();
    draw(A, c.depot, c.orders, c.greedy.routes);
    draw(B, c.depot, c.orders, c.optimised.routes);
    fitTo(A, c.depot, c.orders); fitTo(B, c.depot, c.orders);
    const side = s => `${s.algorithm === 'greedy' ? 'Greedy' : 'Savings + search'}: ${fmt(s.distanceKm)} km, ${s.vans} vans, solved in ${fmt(s.solveMillis, 1)} ms`;
    $('tagA').textContent = side(c.greedy);
    $('tagB').textContent = side(c.optimised);
    const km = c.greedy.distanceKm - c.optimised.distanceKm;
    $('cmpStats').innerHTML = `<strong>${fmt(c.savingsPercent)}% less distance</strong>${fmt(km)} km saved on the same ${c.orders.length} orders.`;
    $('cmp').textContent = 'Back to live simulation';
    stopAnim();
    startAnim([{ view: A, routes: c.greedy.routes }, { view: B, routes: c.optimised.routes }]);
  } catch (e) { say(e.message); }
}
function exitCompare() {
  if (!comparing) return;
  comparing = false;
  stopAnim();
  $('maps').classList.remove('split');
  $('paneB').hidden = true;
  $('cmp').textContent = 'Compare on this scenario';
  $('cmpStats').textContent = '';
  setTimeout(() => { A.map.invalidateSize(); refresh(true); }, 0);
}
$('cmp').onclick = () => comparing ? exitCompare() : enterCompare();

refresh(true).then(connect);
</script>
</body>
</html>
